<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a narrated whiteboard lesson from any topic or your notes.">
  <title>Slate Tutor</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Slate Tutor</div>
    <nav aria-label="Workspace"><button id="new-lesson">New board</button><button id="library-tab">My boards</button></nav>
  </header>
  <main>
    <section id="home">
    <header class="intro"><h1>What shall we unpack?</h1><p>Turn a question or your study notes into a narrated whiteboard.</p></header>
    <section class="composer surface" aria-label="Create a lesson">
      <form id="topic-form">
        <fieldset class="modes"><legend class="sr-only">Lesson mode</legend>
        <label><input type="radio" name="mode" value="Topic" checked>Learn a topic</label>
        <label><input type="radio" name="mode" value="Exam">Exam practice</label>
        <label><input type="radio" name="mode" value="Homework">Homework help</label></fieldset>
        <label for="topic" class="sr-only">Topic or question</label>
        <textarea id="topic" rows="2" maxlength="500" required placeholder="For example, why does an RC circuit delay a signal?"></textarea>
        <div class="composer-tools">
          <div class="selectors">
            <label class="select-label">Level
              <select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
            </label>
            <label class="select-label">Language<select id="language"><option>English</option><option>German</option><option>Telugu</option></select></label>
            <label class="select-label" id="model-label" hidden>Model
              <select id="model"></select>
            </label>
            <button id="topic-mic" class="quiet mic" type="button" hidden>Speak topic</button>
          </div>
          <div class="form-actions">
            <button id="cancel" class="quiet" type="button" hidden>Cancel</button>
            <button id="generate" class="primary" type="submit">Start board →</button>
          </div>
        </div>
        <details class="notes-panel" id="notes-panel">
          <summary>Attach notes or a Wikipedia article</summary>
          <label for="notes" class="sr-only">Study notes</label>
          <textarea id="notes" rows="3" maxlength="12000" placeholder="Paste notes for the tutor to use…"></textarea>
          <div class="source-row"><label>English Wikipedia article URL<input type="url" id="article" placeholder="https://en.wikipedia.org/wiki/Photosynthesis"></label><button class="quiet" type="button" id="import-article">Import introduction</button></div>
          <label class="file-label">Or choose a text file
            <input id="notes-file" type="file" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv">
          </label>
        </details>
        <p id="notice" role="status" class="notice" hidden></p>
      </form>
    </section>

    <section id="recent-section" class="shelf" hidden><h2>Continue learning</h2><div id="recent" class="tiles"></div></section>
    <section class="shelf"><h2>Try a board</h2><div class="tiles"><button data-sample="plant"><small>Biology</small>How photosynthesis works ↗</button><button data-sample="moon"><small>Astronomy</small>Why the Moon changes shape ↗</button><button data-sample="search"><small>Algorithms</small>How binary search works ↗</button></div></section>
    <div class="connection"><span id="model-status" class="model-indicator" role="status"></span><button id="refresh-models" class="quiet">Refresh</button></div>
    </section>
    <section id="library" hidden><h1>My boards</h1><p>Lessons saved in this browser</p><div id="history" class="tiles"></div></section>
    <section id="lesson" class="lesson" aria-label="Current lesson" hidden>
      <div class="lesson-main surface">
        <div class="lesson-heading">
          <div><div class="lesson-type" id="lesson-type"></div><h2 id="lesson-title"></h2></div>
          <label class="narration"><input id="narration" type="checkbox" checked> Narration</label>
        </div>
        <div class="board" id="board">
          <div class="board-meta"><span>Whiteboard</span><span id="counter"></span></div>
          <h3 id="step-title"></h3>
          <div id="diagram" class="diagram"></div>
        </div>
        <div class="transport">
          <button id="back" class="quiet" type="button">Back</button>
          <button id="play" class="secondary" type="button">Play lesson</button>
          <button id="next" class="quiet" type="button">Next step</button>
        </div>
        <div class="transcript">
          <h3>Explanation</h3>
          <p id="explanation"></p>
          <p id="speech-status" class="subtle" role="status" hidden></p>
        </div>
        <form id="followup-form" class="followup">
          <label for="followup">Ask about this step</label>
          <div class="followup-box">
            <input id="followup" maxlength="500" required placeholder="Can you explain that another way?">
            <button id="ask-mic" class="quiet mic" type="button" hidden>Speak</button>
            <button id="ask" class="primary" type="submit">Ask tutor</button>
          </div>
          <p id="ask-status" class="subtle" role="status" hidden></p>
        </form>
      </div>
      <aside class="outline surface" aria-label="Lesson outline">
        <h2>Lesson outline</h2>
        <ol id="outline"></ol>
      </aside>
    </section>
  </main>
</body>
</html>
